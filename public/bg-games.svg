<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0033;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#2d0052;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a3a3a;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#2d1a52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1a2a;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <!-- Dota 2 Side (Left) - Dark Purple with geometric shapes -->
  <g opacity="0.15">
    <!-- Large background shapes for Dota -->
    <polygon points="0,0 400,0 200,400" fill="#7d3c98" opacity="0.3"/>
    <polygon points="0,300 300,200 250,500" fill="#6b2d7f" opacity="0.25"/>
    <circle cx="150" cy="800" r="200" fill="#8b4ab8" opacity="0.2"/>
  </g>

  <!-- Valorant Side (Right) - Teal with geometric shapes -->
  <g opacity="0.15">
    <!-- Large background shapes for Valorant -->
    <polygon points="1920,0 1520,0 1720,400" fill="#00a896" opacity="0.3"/>
    <polygon points="1920,300 1620,200 1670,500" fill="#00897b" opacity="0.25"/>
    <circle cx="1770" cy="800" r="200" fill="#26c6da" opacity="0.2"/>
  </g>

  <!-- Center gradient line -->
  <line x1="960" y1="0" x2="960" y2="1080" stroke="url(#bgGradient)" stroke-width="2" opacity="0.3"/>

  <!-- Dota 2 Accent Lines (Left side) -->
  <g stroke="#7d3c98" stroke-width="2" opacity="0.2">
    <line x1="100" y1="200" x2="300" y2="150"/>
    <line x1="50" y1="600" x2="250" y2="650"/>
    <line x1="200" y1="100" x2="150" y2="350"/>
    <line x1="80" y1="900" x2="280" y2="950"/>
  </g>

  <!-- Valorant Accent Lines (Right side) -->
  <g stroke="#00a896" stroke-width="2" opacity="0.2">
    <line x1="1820" y1="200" x2="1620" y2="150"/>
    <line x1="1870" y1="600" x2="1670" y2="650"/>
    <line x1="1720" y1="100" x2="1770" y2="350"/>
    <line x1="1840" y1="900" x2="1640" y2="950"/>
  </g>

  <!-- Dota 2 Geometric Elements (Left side) -->
  <g opacity="0.3" stroke="#8b4ab8" stroke-width="1" fill="none">
    <rect x="50" y="50" width="100" height="100"/>
    <polygon points="200,300 250,250 300,300 250,350"/>
    <circle cx="150" cy="600" r="40"/>
  </g>

  <!-- Valorant Geometric Elements (Right side) -->
  <g opacity="0.3" stroke="#26c6da" stroke-width="1" fill="none">
    <rect x="1770" y="50" width="100" height="100"/>
    <polygon points="1620,300 1670,250 1720,300 1670,350"/>
    <circle cx="1770" cy="600" r="40"/>
  </g>

  <!-- Subtle dots pattern -->
  <g opacity="0.08" fill="#ffffff">
    <circle cx="200" cy="200" r="2"/>
    <circle cx="400" cy="300" r="2"/>
    <circle cx="300" cy="500" r="2"/>
    <circle cx="150" cy="700" r="2"/>
    <circle cx="500" cy="900" r="2"/>

    <circle cx="1720" cy="200" r="2"/>
    <circle cx="1520" cy="300" r="2"/>
    <circle cx="1620" cy="500" r="2"/>
    <circle cx="1770" cy="700" r="2"/>
    <circle cx="1420" cy="900" r="2"/>

    <circle cx="960" cy="300" r="1.5"/>
    <circle cx="960" cy="600" r="1.5"/>
    <circle cx="960" cy="900" r="1.5"/>
  </g>

  <!-- Faint grid pattern for tech feel -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.05">
    <line x1="0" y1="0" x2="1920" y2="0"/>
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="0" y1="1080" x2="1920" y2="1080"/>
  </g>
</svg>
